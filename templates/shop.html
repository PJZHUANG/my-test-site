<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sourith Next - Electronics Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Sourith Next</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/shop">Shop</a>
                <a class="nav-link" href="/admin">Admin</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="mb-4">Our Products</h2>
        <div class="row g-4">
            {% for product in products %}
            <div class="col-md-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">{{ product[1] }}</h5>
                        <h6 class="card-subtitle mb-2 text-muted">{{ product[2] }}</h6>
                        <p class="card-text">{{ product[5] }}</p>
                        <h4 class="text-primary">${{ product[3] }}</h4>
                        <p class="text-muted">Stock: {{ product[4] }}</p>
                        <button class="btn btn-primary w-100">Add to Cart (Coming Soon)</button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
