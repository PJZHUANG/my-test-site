<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Components | QuarkTwin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505; --primary: #00f2fe; --secondary: #4facfe;
            --text-light: #ffffff; --text-muted: #a0a0a0;
            --glass-bg: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-light); overflow-x: hidden; }
        
        nav { position: fixed; width: 100%; top: 0; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; background: rgba(5, 5, 5, 0.6); backdrop-filter: blur(12px); border-bottom: 1px solid var(--glass-border); z-index: 1000; }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: 2px; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        .nav-links a { color: var(--text-light); text-decoration: none; margin-left: 30px; font-weight: 600; font-size: 14px; transition: color 0.3s; }
        .nav-links a:hover { color: var(--primary); }

        .container { padding: 150px 50px 100px; max-width: 1400px; margin: 0 auto; }
        .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 50px; }
        .header-area h1 { font-size: 3rem; font-weight: 800; }
        .cart-btn { background: linear-gradient(to right, var(--primary), var(--secondary)); color: #000; padding: 12px 25px; border-radius: 30px; text-decoration: none; font-weight: 800; display: flex; align-items: center; gap: 10px; transition: transform 0.3s; }
        .cart-btn:hover { transform: scale(1.05); }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .product-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 30px; display: flex; flex-direction: column; transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s; }
        .product-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 30px rgba(0,242,254,0.1); }
        
        .p-model { color: var(--primary); font-size: 14px; font-weight: 600; margin-bottom: 10px; letter-spacing: 1px; }
        .p-name { font-size: 1.5rem; font-weight: 800; margin-bottom: 15px; }
        .p-desc { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 20px; flex-grow: 1; }
        .p-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; border-top: 1px solid var(--glass-border); padding-top: 20px; }
        .p-price { font-size: 1.8rem; font-weight: 800; color: var(--text-light); }
        .p-stock { font-size: 12px; color: var(--text-muted); display: block; margin-top: 5px; }
        
        .btn-add { background: rgba(255,255,255,0.1); color: white; border: 1px solid var(--glass-border); padding: 10px 20px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.3s; cursor: pointer; }
        .btn-add:hover { background: var(--primary); color: #000; border-color: var(--primary); }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">QuarkTwin</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/admin">Admin</a>
        </div>
    </nav>

    <div class="container">
        <div class="header-area" data-aos="fade-down">
            <h1>Explore Components</h1>
            <a href="/cart" class="cart-btn">🛒 View Cart</a>
        </div>

        <div class="product-grid">
            <!-- 保留 Jinja2 循环 -->
            {% for product in products %}
            <div class="product-card" data-aos="fade-up" data-aos-delay="{{ loop.index0 * 100 }}">
                <div class="p-model">{{ product[2] }}</div>
                <div class="p-name"><a href="/product/{{ product[0] }}" style="color: white; text-decoration: none;">{{ product[1] }}</a></div>
                <div class="p-desc">{{ product[5] }}</div>
                <div class="p-bottom">
                    <div>
                        <div class="p-price">${{ product[3] }}</div>
                        <span class="p-stock">In Stock: {{ product[4] }}</span>
                    </div>
                    <!-- 保留原有的加购跳转路径 -->
                    <a href="/add_to_cart/{{ product[0] }}" class="btn-add">Add to Cart</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init();</script>
</body>
</html>
